name: Build Python distributions, publish on PyPI, and create a GitHub release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  PYPI_PROJECT_URL: "https://pypi.org/p/django-altcha-widget"
  # Pinned, so an uv release is something bumped here rather than something the
  # release build silently picks up.
  UV_VERSION: "0.12.3"

jobs:
  # A tag that fails on one of the supported Python/Django combinations must not
  # reach PyPI, where a version can be yanked but never replaced. This is the
  # same matrix that runs on a pull request, called rather than duplicated.
  test:
    name: Run unit tests
    uses: ./.github/workflows/run-unit-tests.yml

  build-python-dist:
    name: Build Python distributions
    needs:
      - test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false  # do not keep the token around

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: 3.14

      - name: Build a binary wheel and a source tarball
        run: uv build --sdist --wheel --out-dir dist/

      # The vendored assets reach the wheel through package-data globs, so they
      # can go missing without failing the build or the tests. Catch that here
      # rather than in an installed environment after the upload. The script is
      # stdlib-only, so the runner's Python is enough — no virtualenv needed.
      - name: Check the built distributions
        run: python3 scripts/check_dist.py ${EXPECT_VERSION:+--expect-version "$EXPECT_VERSION"}
        env:
          # Empty on workflow_dispatch, where the ref is a branch rather than a
          # release tag and there is no version to agree with.
          EXPECT_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      # What this gate adds is narrower than it looks, and worth stating so it
      # is not credited with more than it does: run-unit-tests already requires
      # a changelog section for `__version__`, and --expect-version above ties
      # the tag to `__version__`, so a tag whose section is *missing* has
      # already failed by now. What only this step catches is a section that
      # exists but is still headed `(unreleased)`, or one that is empty.
      #
      # It belongs here rather than in create-gh-release all the same: that job
      # runs after pypi-publish, and a version on PyPI can be yanked but never
      # replaced, so this has to fail while failing is still free. The output is
      # discarded — create-gh-release re-runs the script for the notes
      # themselves, which is deterministic.
      - name: Check the release notes can be extracted
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > /dev/null

      - name: Upload package distributions as GitHub workflow artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: python-package-distributions
          path: dist/

  # Only set the id-token: write permission in the job that does publishing, not globally.
  # Also, separate building from publishing — this makes sure that any scripts
  # maliciously injected into the build or test environment won't be able to elevate
  # privileges while flying under the radar.
  pypi-publish:
    name: Upload package distributions to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
      - build-python-dist
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: ${{ env.PYPI_PROJECT_URL }}
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Download package distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0

  create-gh-release:
    name: Create GitHub release
    # After the upload, not alongside it: a release announcing a version that
    # never reached PyPI is worse than no release at all. On workflow_dispatch
    # pypi-publish is skipped, which skips this job too, leaving the run as a
    # build check — which is all it can be, since there is no tag to release.
    needs:
      - build-python-dist
      - pypi-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Download package distributions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: python-package-distributions
          path: dist/

      # Notes come from the changelog rather than from --generate-notes, which
      # would list the merged pull requests, `chore(deps)` bumps included.
      # build-python-dist has already run this against the same tag and commit,
      # so reaching this step means the extraction succeeds: a section left
      # undated or empty stopped the release before anything was uploaded.
      - name: Extract the release notes from CHANGELOG.md
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > release_notes.md

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
