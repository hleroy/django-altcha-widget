# Optional developer convenience: `just hooks` installs it. CI does not run
# pre-commit — the same checks run there as `just check`, `just check-altcha`
# and `just test` — so a contributor who has not installed the hooks is never
# blocked by them.
#
# No `default_language_version`: the matrix spans Python 3.12–3.14 and uv
# supplies the interpreter, which is not necessarily a `python3.13` on PATH.
# Pinning one here would fail for a contributor who has a perfectly good cell
# synced.
#
# Three hook types are in play, so `just hooks` installs all three. Without
# `default_stages` the unstaged hooks below would default to *every* stage and
# run again in full on `git push`.
default_stages: [pre-commit]

# The vendored ALTCHA assets are verified byte for byte by `just check-altcha`,
# so no hook may rewrite them: one trailing newline stripped or added here fails
# CI and builds a wheel of altered bytes. `.gitattributes` (`* -text`) exists to
# stop Git doing the same thing. CHECKSUMS and VENDOR.json are generated by
# scripts/sync_altcha.py and are covered by the same rule.
exclude: ^src/django_altcha_widget/static/django_altcha_widget/altcha/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # These three declare `stages: [pre-commit, pre-push, manual]` upstream,
      # and a hook's own stages beat `default_stages` — without pinning them
      # they run a second time on every push, over files that already passed.
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: detect-private-key
      # Default limit is 500 kB. The largest tracked file is uv.lock at ~100 kB
      # and the biggest vendored asset ~83 kB, so this has headroom without
      # needing a raised threshold.
      - id: check-added-large-files
        stages: [pre-commit]

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.31.1
    hooks:
      - id: django-upgrade
        # Matches the `Django>=6.0` floor in pyproject.toml, not the newest
        # cell in the matrix: rewriting to 6.1 idioms would break the 6.0 cell.
        args: ["--target-version", "6.0"]

  # Conventional Commits, on the commit-msg stage. `chore` covers the
  # `chore(deps)` and `chore(ci)` prefixes Dependabot is configured to use in
  # .github/dependabot.yml, so its pull requests pass unchanged.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, chore, docs, test, style, perf, ci, build, revert]

  - repo: local
    hooks:
      # Ruff deliberately does NOT come from ruff-pre-commit. It is pinned
      # exactly as `ruff==0.16.2` in the test-base dependency group, because its
      # formatter output and lint defaults move across minor releases. A `rev:`
      # here would be a second pin to keep in step, and the failure mode is
      # silent: pre-commit reformats a file on commit and CI then rejects it.
      # Running the one already-pinned binary makes that drift impossible.
      #
      # Whole-tree rather than per-file, because `just check` and CI run it that
      # way and ruff formats Python inside Markdown code blocks (0.16+) — a
      # filename-scoped hook would quietly skip README.md.
      - id: ruff-check
        name: ruff check (pinned in test-base)
        entry: .venv/bin/ruff check --fix --exit-non-zero-on-fix
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format (pinned in test-base)
        entry: .venv/bin/ruff format
        language: system
        pass_filenames: false
        always_run: true

      # 66 ms and offline. This is the backstop for the `exclude` above: if a
      # hook or an edit ever does rewrite a vendored byte, it fails at the
      # commit rather than in CI. `always_run` because the global exclude would
      # otherwise leave a `files:` pattern matching nothing.
      - id: check-altcha
        name: check vendored ALTCHA assets
        entry: .venv/bin/python scripts/sync_altcha.py --check
        language: system
        pass_filenames: false
        always_run: true

      # Pre-push rather than pre-commit. The suite is fast enough for either
      # (~0.2 s), but it only ever exercises the one synced matrix cell, so a
      # green run is a smoke test rather than the matrix CI runs — pre-push is
      # where that is worth paying for.
      - id: pytest
        name: pytest (pre-push)
        entry: just test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

ci:
  autoupdate_schedule: quarterly
  # The local hooks need this project's virtualenv and `just`, neither of which
  # exists on pre-commit.ci. They run in GitHub Actions instead.
  skip: [ruff-check, ruff-format, check-altcha, pytest]
  submodules: false
